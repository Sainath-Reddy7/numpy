name: gh-10866 fromfile compressed validation

on: [push]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install meson-python ninja cython pybind11 pytest
      - run: python -m pip wheel . --no-build-isolation -w dist/
      - run: python -m pip install dist/*.whl
      - run: cd / && python -m pytest --pyargs numpy._core.tests.test_multiarray -k "fromfile or compression" -v
